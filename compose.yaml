services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: still
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: still
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - still-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U still -d still"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  still-data:
